<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">DriveNow</a>
            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm">Home</a>
                <a href="login.html" class="btn btn-outline-light btn-sm">Login</a>
                <a href="signup.html" class="btn btn-light btn-sm">Signup</a>
            </div>
        </div>
    </nav>

    <div class="container p-5">
        <h2>Available Cars</h2>
        <hr>
        <h3 class="text-center mb-5">Rent your car today</h3>
        <div class="row">
            <div class="col">
                <div class="card p-3 mx-auto" style="width: 300px">
                    <img src="https://via.placeholder.com/100" class="card-img-top" alt="Toyota Corolla">
                    <h4>Toyota Corolla</h4>
                    <p>Rate: Rs. 6,000 / day</p>
                    <a href="login.html" class="btn btn-dark btn-sm">Book Now</a>
                </div>
            </div>

            <div class="col">
                <div class="card p-3 mx-auto" style=" width: 300px">
                    <img src="https://via.placeholder.com/100" class="card-img-top" alt="Honda Civic">
                    <h4>Honda Civic</h4>
                    <p>Rate: Rs. 8,000 / day</p>
                    <a href="login.html" class="btn btn-dark btn-sm">Book Now</a>
                </div>
            </div>

            <div class="col">
                <div class="card p-3 mx-auto" style=" width: 300px">
                    <img src="https://via.placeholder.com/100" class="card-img-top" alt="Prado">
                    <h4>Prado</h4>
                    <p>Rate: Rs. 12,000 / day</p>
                    <a href="login.html" class="btn btn-dark btn-sm">Book Now</a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
